              </div>
            )}
          </div>
        );
      }

      // ── HEATMAP CALENDAR ─────────────────────────────────────────
      function HeatmapCalendar({sessions}) {
        const [tooltip, setTooltip] = useState(null);
        const allDates = getDateRange(START_DATE.toISOString().split("T")[0], END_DATE.toISOString().split("T")[0]);
        const hoursByDate = {};
        sessions.forEach(s=>{ hoursByDate[s.date] = (hoursByDate[s.date]||0) + s.duration/3600; });
        const cellColor = h => {
          if (!h || h === 0) return "rgba(255,255,255,.04)";
          if (h < 1) return "#1a3a2a";
          if (h < 2) return "#1e5c35";
          if (h < 4) return "#25a244";
          return "#4ade80";
        };
        // Group by week columns
        const firstDay = new Date(allDates[0]+"T00:00:00");
        const startDow = firstDay.getDay(); // 0=Sun
        const cells = Array(startDow).fill(null).concat(allDates);
        const weeks = [];
        for (let i=0; i<cells.length; i+=7) weeks.push(cells.slice(i,i+7));
        // Month labels
        const monthLabels = [];
        weeks.forEach((week,wi)=>{
          week.forEach(d=>{
            if (!d) return;
            const dt = new Date(d+"T00:00:00");
            if (dt.getDate()<=7) {
              const lbl = dt.toLocaleDateString("en-US",{month:"short"});
              if (!monthLabels.find(m=>m.label===lbl)) monthLabels.push({label:lbl, col:wi});
            }
          });
        });
        const today = getTodayStr();
        const DAYS = ["S","M","T","W","T","F","S"];
        return (
          <div>
            <div style={{display:"flex",alignItems:"flex-start",gap:16,overflowX:"auto",paddingBottom:8}}>
              {/* Day labels */}
              <div style={{display:"flex",flexDirection:"column",gap:2,paddingTop:20,flexShrink:0}}>
                {DAYS.map((d,i)=>(
                  <div key={i} style={{height:13,fontSize:9,color:"#374151",fontWeight:700,lineHeight:"13px",textAlign:"right",paddingRight:4}}>{i===1||i===3||i===5?d:""}</div>
                ))}
              </div>
              {/* Grid */}
              <div style={{flex:1,overflowX:"auto"}}>
                <div style={{position:"relative",height:20,marginBottom:2}}>
                  {monthLabels.map((m,i)=>(
                    <span key={i} style={{position:"absolute",left:`${m.col*(13+2)}px`,fontSize:10,color:"#4b5563",fontWeight:700,whiteSpace:"nowrap"}}>{m.label}</span>
                  ))}
                </div>
                <div style={{display:"flex",gap:2}}>
                  {weeks.map((week,wi)=>(
                    <div key={wi} style={{display:"flex",flexDirection:"column",gap:2}}>
                      {week.map((d,di)=>{
                        if (!d) return <div key={di} style={{width:13,height:13}}/>;
                        const h = hoursByDate[d]||0;
                        const isToday = d===today;
                        const isFuture = d>today;
                        const daySessions = sessions.filter(s=>s.date===d);
                        return (
                          <div key={di} onClick={()=>daySessions.length>0||h>0?setTooltip(tooltip?.date===d?null:{date:d,sessions:daySessions,hours:h}):null}
                            style={{
                              width:13,height:13,borderRadius:2,
                              background:isFuture?"rgba(255,255,255,.02)":cellColor(h),
                              border:isToday?`1px solid #f59e0b`:"1px solid transparent",
                              cursor:daySessions.length>0?"pointer":"default",
                              opacity:isFuture?0.4:1,
                              transition:"transform .1s",
                            }}
                            title={`${d}: ${h.toFixed(1)}h`}
                          />
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
            </div>
            {/* Legend */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:16,flexWrap:"wrap"}}>
              <span style={{fontSize:11,color:"#4b5563",fontWeight:700}}>Less</span>
              {[0,"<1h","1-2h","2-4h","4h+"].map((lbl,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                  <div style={{width:12,height:12,borderRadius:2,background:i===0?"rgba(255,255,255,.04)":i===1?"#1a3a2a":i===2?"#1e5c35":i===3?"#25a244":"#4ade80"}}/>
                  <span style={{fontSize:10,color:"#4b5563"}}>{lbl}</span>
                </div>
              ))}
              <span style={{fontSize:11,color:"#4b5563",fontWeight:700}}>More</span>
            </div>
            {/* Tooltip */}
            {tooltip&&(
              <div style={{marginTop:16,background:"rgba(11,21,37,.95)",border:"1px solid rgba(245,158,11,.3)",borderRadius:12,padding:"16px 20px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div>
                    <div style={{fontFamily:"'Orbitron',monospace",fontSize:12,color:"#f59e0b",fontWeight:700}}>{formatDate(tooltip.date)}</div>
                    <div style={{fontSize:13,color:"#4b5563",marginTop:2}}>{tooltip.hours.toFixed(1)} hours total</div>
                  </div>
                  <button onClick={()=>setTooltip(null)} style={{background:"none",border:"none",color:"#4b5563",cursor:"pointer",fontSize:20}}>×</button>
                </div>
                {tooltip.sessions.length===0?<div style={{fontSize:13,color:"#374151",fontStyle:"italic"}}>No sessions recorded</div>:(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {tooltip.sessions.map(s=>{
                      const cat=STUDY_CATEGORIES.find(c=>c.id===s.categoryId)||{label:s.categoryId,color:"#94a3b8",icon:"📚"};
                      return (
                        <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:`${cat.color}12`,borderRadius:8,border:`1px solid ${cat.color}25`}}>
                          <span style={{fontSize:18}}>{cat.icon}</span>
                          <div style={{flex:1}}>
                            <div style={{fontSize:13,color:cat.color,fontWeight:700}}>{cat.label}</div>
                            <div style={{fontSize:11,color:"#4b5563"}}>{new Date(s.startTime).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true})} – {new Date(s.endTime).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true})}</div>
                          </div>
                          <div style={{fontFamily:"'Orbitron',monospace",fontSize:13,fontWeight:700,color:cat.color}}>{formatDuration(s.duration)}</div>
                          <span style={{fontSize:16}}>{s.productivityEmoji}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      // ── FOCUS MODE ───────────────────────────────────────────────
      function FocusMode({activeSession, onClose, onPause, onResume, onStop}) {
        const cat = activeSession ? STUDY_CATEGORIES.find(c=>c.id===activeSession.categoryId) : null;
        const quote = QUOTES[new Date().getSeconds() % QUOTES.length];
        useEffect(()=>{
          const handler = e => {
            if (e.code==="Escape") onClose();
            if (e.code==="Space" && activeSession) {
              e.preventDefault();
              if (activeSession.paused) onResume(activeSession.categoryId);
              else onPause(activeSession.categoryId);
            }
          };
          window.addEventListener("keydown", handler);
          return ()=>window.removeEventListener("keydown", handler);
        }, [activeSession?.categoryId, activeSession?.paused]);
        if (!cat || !activeSession) return null;
        return (
          <div style={{
            position:"fixed",inset:0,zIndex:5000,
            background:"#08101e",
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          }}>
            {/* Animated radial glow */}
            <div style={{
              position:"absolute",inset:0,
              background:`radial-gradient(ellipse at center, ${cat.color}18 0%, transparent 70%)`,
              animation:"focusGlow 3s ease-in-out infinite",
              pointerEvents:"none",
            }}/>
            <div style={{position:"relative",textAlign:"center",maxWidth:600,padding:"0 24px"}}>
              <div style={{fontSize:64,marginBottom:8}}>{cat.icon}</div>
              <div style={{fontFamily:"'Orbitron',monospace",fontSize:18,fontWeight:700,color:cat.color,letterSpacing:3,marginBottom:24}}>{cat.label.toUpperCase()}</div>
              <div style={{
                fontFamily:"'Orbitron',monospace",
                fontSize:"clamp(52px,10vw,96px)",
                fontWeight:900,
                color:activeSession.paused?"#4b5563":cat.color,
                letterSpacing:2,lineHeight:1,
                textShadow:`0 0 80px ${cat.color}60`,
                marginBottom:32,
                transition:"color .3s",
              }}>{formatHMS(activeSession.elapsed)}</div>
              <div style={{fontSize:14,color:"#4b5563",marginBottom:32,fontStyle:"italic",maxWidth:400,margin:"0 auto 32px"}}>"{quote}"</div>
              <div style={{display:"flex",gap:16,justifyContent:"center",flexWrap:"wrap",marginBottom:24}}>
                <button onClick={activeSession.paused?()=>onResume(cat.id):()=>onPause(cat.id)} style={{
                  padding:"16px 36px",borderRadius:12,border:`1px solid ${cat.color}60`,
                  background:`${cat.color}25`,color:cat.color,cursor:"pointer",fontSize:18,fontWeight:700,fontFamily:"inherit",
                }}>{activeSession.paused?"▶ Resume":"⏸ Pause"}</button>
                <button onClick={()=>{onStop(cat.id);onClose();}} style={{
                  padding:"16px 36px",borderRadius:12,border:"1px solid rgba(239,68,68,.5)",
                  background:"rgba(239,68,68,.2)",color:"#ef4444",cursor:"pointer",fontSize:18,fontWeight:700,fontFamily:"inherit",
                }}>⏹ Stop</button>
              </div>
              <div style={{fontSize:12,color:"#2d3748",letterSpacing:1}}>
                Press <kbd style={{background:"rgba(255,255,255,.08)",padding:"2px 8px",borderRadius:4}}>Esc</kbd> to exit focus mode &nbsp;·&nbsp;
                <kbd style={{background:"rgba(255,255,255,.08)",padding:"2px 8px",borderRadius:4}}>Space</kbd> to pause/resume
              </div>
            </div>
          </div>
        );
      }

      // ── GOAL EDITOR ──────────────────────────────────────────────
      function GoalEditor({goals, onSave, onClose}) {
        const [local, setLocal] = useState(() => {
          const g = {};
          STUDY_CATEGORIES.forEach(c=>{ g[c.id]={...DEFAULT_GOALS[c.id],...(goals[c.id]||{})}; });
          return g;
        });
        const update = (cat, field, val) => {
          const n = parseFloat(val);
          if (isNaN(n) || n < 0) return;
          setLocal(p=>({...p,[cat]:{...p[cat],[field]:n}}));
        };
        return (
          <div style={{position:"fixed",inset:0,zIndex:3000,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
            <div style={{background:"#0d1628",border:"1px solid rgba(245,158,11,.25)",borderRadius:20,padding:28,width:520,maxWidth:"100%",maxHeight:"80vh",overflowY:"auto"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                <span style={{fontFamily:"'Orbitron',monospace",fontSize:14,color:"#f59e0b",letterSpacing:1}}>🎯 SET STUDY GOALS</span>
                <button onClick={onClose} style={{background:"none",border:"none",color:"#4b5563",cursor:"pointer",fontSize:24}}>×</button>
              </div>
              {STUDY_CATEGORIES.map(c=>(
                <div key={c.id} style={{marginBottom:16,padding:"14px 16px",background:`${c.color}08`,border:`1px solid ${c.color}20`,borderRadius:12}}>
                  <div style={{fontSize:13,color:c.color,fontWeight:700,marginBottom:10}}>{c.icon} {c.label}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                    {[["daily","Daily (h)"],["weekly","Weekly (h)"],["total110","110-Day (h)"]].map(([field,lbl])=>(
                      <div key={field}>
                        <div style={{fontSize:9,color:"#4b5563",fontWeight:700,letterSpacing:1,marginBottom:4}}>{lbl}</div>
                        <input type="number" step="0.5" min="0" value={local[c.id][field]} onChange={e=>update(c.id,field,e.target.value)} style={{
                          width:"100%",background:"rgba(255,255,255,.05)",border:`1px solid ${c.color}30`,
                          borderRadius:8,padding:"8px 10px",fontSize:14,color:c.color,outline:"none",fontFamily:"inherit",boxSizing:"border-box",
                        }}/>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
              <button onClick={()=>onSave(local)} style={{
                width:"100%",marginTop:8,padding:"14px",borderRadius:10,
                border:"1px solid rgba(52,211,153,.3)",background:"rgba(52,211,153,.12)",
                color:"#34d399",cursor:"pointer",fontSize:15,fontWeight:700,fontFamily:"inherit",
              }}>✓ SAVE GOALS</button>
            </div>
          </div>
        );
      }

      // ── ACHIEVEMENT BADGE ─────────────────────────────────────────
      function AchievementBadge({achievement, unlocked, unlockedDate}) {
        return (
          <div style={{
            background:unlocked?`rgba(245,158,11,.08)`:"rgba(255,255,255,.02)",
            border:`1px solid ${unlocked?"rgba(245,158,11,.3)":"rgba(255,255,255,.06)"}`,
            borderRadius:12,padding:"14px 16px",textAlign:"center",
            opacity:unlocked?1:0.5,
            minWidth:120,
          }}>
            <div style={{fontSize:28,marginBottom:6,filter:unlocked?"none":"grayscale(1)"}}>{achievement.icon}</div>
            <div style={{fontSize:11,fontWeight:700,color:unlocked?"#f59e0b":"#4b5563",marginBottom:4,lineHeight:1.2}}>{achievement.label}</div>
            <div style={{fontSize:10,color:"#374151",lineHeight:1.3}}>{achievement.desc}</div>
            {unlocked&&unlockedDate&&<div style={{fontSize:9,color:"#34d399",marginTop:6}}>✓ Unlocked</div>}
            {!unlocked&&<div style={{fontSize:9,color:"#2d3748",marginTop:6}}>🔒 Locked</div>}
          </div>
        );
      }

      // ── APP ──────────────────────────────────────────────────────
      function App() {
        // Existing state
        const [days,setDays]                 = useState([]);
        const [view,setView]                 = useState("today");
        const [loading,setLoading]           = useState(true);
        const [saveStatus,setSaveStatus]     = useState("");
        const [habits,setHabits]             = useState([]);
        const [showHabitSetup,setHabitSetup] = useState(false);
        const [confetti,setConfetti]         = useState(false);
        const [xpFlash,setXpFlash]           = useState({vis:false,xp:0,emoji:"⚡"});
        const [pomXP,setPomXP]               = useState(0);
        const [sessionsXP,setSessionsXP]     = useState(0);
        // New state
        const [sessions,setSessions]         = useState([]);
        const [goals,setGoals]               = useState(DEFAULT_GOALS);
        const [achievements,setAchievements] = useState([]);
        const [activeSession,setActiveSession] = useState(null);
        const [focusModeActive,setFocusMode] = useState(false);
        const [activeTab,setActiveTab]       = useState("dashboard");
        const [showGoalEditor,setGoalEditor] = useState(false);
        const timerRef = useRef(null);
        const pendingSessionRef = useRef(null);
        const sessionsRef = useRef([]);
        const today = getTodayStr();

        // ── LOAD ──
        useEffect(()=>{
          async function load() {
            const d = await loadDays();
            setDays(d||generateDays());
            const h = await gStore(HABITS_KEY);
            setHabits(h||[{id:"w",name:"Drink Water (8 glasses)",emoji:"💧"},{id:"e",name:"Exercise / Move",emoji:"🏃"},{id:"r",name:"Read 30 min",emoji:"📚"}]);
            const px = await gStore(POMO_KEY);
            if(px) setPomXP(px);
            const sxp = await gStore(SESSIONSXP_KEY);
            if (sxp !== null && sxp !== undefined) setSessionsXP(sxp);
            const sess = await gStore(SESSIONS_KEY);
            if(sess) setSessions(sess);
            const g = await gStore(GOALS_KEY);
            if(g) setGoals({...DEFAULT_GOALS,...g});
            const ach = await gStore(ACHIEVEMENTS_KEY);
            if(ach) setAchievements(ach);
            // Crash recovery
            const saved = await gStore(ACTIVE_SESSION_KEY);
            if(saved&&saved.startTime) {
              const elapsed = saved.paused
                ? saved.elapsed  // paused: use saved elapsed directly
                : Math.max(0, Math.floor((Date.now()-new Date(saved.startTime))/1000));
              const restored = {...saved, elapsed};
              setActiveSession(restored);
              startTimerInterval(restored);
            }
            setLoading(false);
          }
          load();
          return ()=>clearInterval(timerRef.current);
        },[]);

        // ── PERSIST ──
        useEffect(()=>{ if(!loading&&days.length>0) sStore(STORAGE_KEY,days); },[days,loading]);
        useEffect(()=>{ if(!loading) sStore(HABITS_KEY,habits); },[habits,loading]);
        useEffect(()=>{ if(!loading&&pomXP>0) sStore(POMO_KEY,pomXP); },[pomXP,loading]);
        useEffect(()=>{ if(!loading) sStore(SESSIONS_KEY,sessions); sessionsRef.current=sessions; },[sessions,loading]);
        useEffect(()=>{ if(!loading&&sessionsXP>0) sStore(SESSIONSXP_KEY,sessionsXP); },[sessionsXP,loading]);
        useEffect(()=>{ if(!loading) sStore(GOALS_KEY,goals); },[goals,loading]);
        useEffect(()=>{ if(!loading) sStore(ACHIEVEMENTS_KEY,achievements); },[achievements,loading]);

        // ── TIMER HELPERS ──
        function startTimerInterval(session) {
          clearInterval(timerRef.current);
          if (session.paused) return;
          timerRef.current = setInterval(()=>{
            setActiveSession(prev=>{
              if(!prev||prev.paused) return prev;
              return {...prev, elapsed: prev.elapsed+1};
            });
          },1000);
        }

        // ── SESSION HANDLERS ──
        const startSession = catId => {
          const s = {categoryId:catId, startTime:new Date().toISOString(), elapsed:0, paused:false};
          setActiveSession(s);
          sStore(ACTIVE_SESSION_KEY, s);
          startTimerInterval(s);
        };
        const pauseSession = () => {
          clearInterval(timerRef.current);
          setActiveSession(prev=>{
            if(!prev) return prev;
            const updated={...prev,paused:true};
            sStore(ACTIVE_SESSION_KEY,updated);
            return updated;
          });
        };
        const resumeSession = () => {
          setActiveSession(prev=>{
            if(!prev) return prev;
            const updated={...prev,paused:false};
            sStore(ACTIVE_SESSION_KEY,updated);
            startTimerInterval(updated);
            return updated;
          });
        };
        const stopSession = () => {
          clearInterval(timerRef.current);
          setActiveSession(prev=>{
            if(!prev) return null;
            const endTime = new Date().toISOString();
            const dur = prev.elapsed;
            const xp = sessionXP(dur);
            const newSession = {
              id:Date.now().toString(), categoryId:prev.categoryId,
              startTime:prev.startTime, endTime,
              duration:dur, date:prev.startTime.split("T")[0],
              xpEarned:xp, productivityEmoji:productivityEmoji(dur),

            pendingSessionRef.current = {newSession, xp};
            return null;
          });

        // Process pending session after activeSession becomes null
        useEffect(()=>{
          if(activeSession===null&&pendingSessionRef.current) {
            const {newSession, xp} = pendingSessionRef.current;
            pendingSessionRef.current = null;
            const updatedSessions = [...sessionsRef.current, newSession];
            setSessions(updatedSessions);
            sStore(SESSIONS_KEY, updatedSessions);
            sStore(ACTIVE_SESSION_KEY, null);
            try { localStorage.removeItem(ACTIVE_SESSION_KEY); } catch{}
            setSessionsXP(p=>p+xp);
            if(xp>0) { fireXP(xp,"📚"); fireConfetti(); }
            checkAchievementsForSessions(updatedSessions);

                        const totalSecs110=sumSessionsByCategory(sessions,c.id);
                        const dp=g.daily>0?Math.min(100,Math.round(todaySecs/3600/g.daily*100)):0;
                        const wp=g.weekly>0?Math.min(100,Math.round(weeklySecs/3600/g.weekly*100)):0;
                        const tp=g.total110>0?Math.min(100,Math.round(totalSecs110/3600/g.total110*100)):0;
                        return (
                          <div key={c.id} style={{padding:"12px 14px",background:`${c.color}08`,border:`1px solid ${c.color}20`,borderRadius:10}}>
                            <div style={{fontSize:12,color:c.color,fontWeight:700,marginBottom:8}}>{c.icon} {c.label}</div>
                            {[["D",dp,`${(todaySecs/3600).toFixed(1)}/${g.daily}h`],["W",wp,`${(weeklySecs/3600).toFixed(1)}/${g.weekly}h`],["110",tp,`${(totalSecs110/3600).toFixed(0)}/${g.total110}h`]].map(([lbl,pct,sub])=>(
                              <div key={lbl} style={{marginBottom:4}}>
                                <div style={{display:"flex",justifyContent:"space-between",fontSize:9,fontWeight:700,marginBottom:2}}>
                                  <span style={{color:"#4b5563",letterSpacing:1}}>{lbl}</span>
                                  <span style={{color:c.color}}>{sub}</span>
                                </div>
                                <div style={{background:"rgba(255,255,255,.05)",borderRadius:999,height:4,overflow:"hidden"}}>
                                  <div style={{height:"100%",width:`${pct}%`,background:c.color,borderRadius:999,transition:"width .5s"}}/>
                                </div>
                              </div>
                            ))}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Bottom row: Recent sessions + Quote + Achievements */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
                    {/* Recent Sessions */}
                    <div style={{background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.07)",borderRadius:16,padding:"20px 20px"}}>
                      <div style={{fontSize:12,color:"#4b5563",letterSpacing:2,fontWeight:800,marginBottom:14}}>⏱ RECENT SESSIONS</div>
                      {recentSessions.length===0?<div style={{fontSize:13,color:"#2d3748",fontStyle:"italic"}}>No sessions yet</div>:(
                        recentSessions.map(s=>{
                          const c=STUDY_CATEGORIES.find(x=>x.id===s.categoryId)||{label:s.categoryId,color:"#94a3b8",icon:"📚"};
                          return (
                            <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:"8px 10px",background:`${c.color}0a`,borderRadius:8,borderLeft:`2px solid ${c.color}`}}>
                              <span style={{fontSize:16}}>{c.icon}</span>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontSize:12,color:c.color,fontWeight:700}}>{c.label}</div>
                                <div style={{fontSize:11,color:"#374151"}}>{s.date}</div>
                              </div>
                              <div style={{fontFamily:"'Orbitron',monospace",fontSize:12,fontWeight:700,color:c.color}}>{formatDuration(s.duration)}</div>
                              <span style={{fontSize:14}}>{s.productivityEmoji}</span>
                            </div>
                          );
                        })
                      )}
                    </div>
                    {/* Quote + daily tip */}
                    <div style={{display:"flex",flexDirection:"column",gap:14}}>
                      <div style={{background:"linear-gradient(135deg,rgba(245,158,11,.06),rgba(251,191,36,.03))",border:"1px solid rgba(245,158,11,.2)",borderRadius:16,padding:"20px 20px",flex:1}}>
                        <div style={{fontSize:10,color:"#f59e0b",letterSpacing:2,fontWeight:800,marginBottom:10}}>💡 DAILY QUOTE</div>
                        <div style={{fontSize:15,color:"#cbd5e1",lineHeight:1.6,fontStyle:"italic"}}>"{quote}"</div>
                      </div>
                      <div style={{background:"rgba(52,211,153,.06)",border:"1px solid rgba(52,211,153,.2)",borderRadius:16,padding:"16px 20px"}}>
                        <div style={{fontSize:10,color:"#34d399",letterSpacing:2,fontWeight:800,marginBottom:6}}>🔥 TODAY'S FOCUS</div>
                        <div style={{fontFamily:"'Orbitron',monospace",fontSize:28,fontWeight:900,color:"#34d399"}}>{todayHours.toFixed(1)}h</div>
                        <div style={{fontSize:12,color:"#4b5563",marginTop:4}}>{sessions.filter(s=>s.date===today).length} sessions today</div>
                      </div>
                    </div>
                  </div>

                  {/* Achievements */}
                  <div style={{background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.07)",borderRadius:16,padding:"20px 24px"}}>
                    <div style={{fontSize:12,color:"#4b5563",letterSpacing:2,fontWeight:800,marginBottom:14}}>🏆 ACHIEVEMENTS</div>
                    <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                      {ACHIEVEMENTS_DEF.map(a=>(
                        <AchievementBadge key={a.id} achievement={a} unlocked={achievements.includes(a.id)}/>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ========== TIMER TAB ========== */}
              {activeTab==="timer"&&(
                <div>
                  <SessionTimer sessions={sessions} goals={goals} activeSession={activeSession}
                    onStart={startSession} onPause={pauseSession} onResume={resumeSession} onStop={stopSession}
                    onFocusMode={()=>setFocusMode(true)} isFocusModeActive={focusModeActive}/>
                  <div style={{fontSize:12,color:"#4b5563",letterSpacing:2,fontWeight:800,marginBottom:12}}>📚 CATEGORY OVERVIEW</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
                    {STUDY_CATEGORIES.map(c=>(
                      <CategoryCard key={c.id} category={c} sessions={sessions} goals={goals} activeSession={activeSession}
                        onStart={startSession} onPause={pauseSession} onResume={resumeSession} onStop={stopSession} compact={false}/>
                    ))}
                  </div>
                </div>
              )}

              {/* ========== SESSIONS TAB ========== */}
              {activeTab==="sessions"&&(
                <div>
                  <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontFamily:"'Orbitron',monospace",fontSize:16,fontWeight:700,color:"#f59e0b",marginBottom:4}}>SESSION HISTORY</div>
                      <div style={{fontSize:13,color:"#4b5563"}}>{sessions.length} total sessions · {totalHours.toFixed(1)}h total</div>
                    </div>
                  </div>
                  <SessionHistoryPanel sessions={sessions} onDelete={deleteSession}/>
                </div>
              )}

              {/* ========== ANALYTICS TAB ========== */}
              {activeTab==="analytics"&&(
                <div>
                  <div style={{fontFamily:"'Orbitron',monospace",fontSize:16,fontWeight:700,color:"#f59e0b",marginBottom:20}}>ANALYTICS</div>
                  <AnalyticsPanel sessions={sessions}/>
                </div>
              )}

              {/* ========== HEATMAP TAB ========== */}
              {activeTab==="heatmap"&&(
                <div>
                  <div style={{fontFamily:"'Orbitron',monospace",fontSize:16,fontWeight:700,color:"#f59e0b",marginBottom:4}}>110-DAY STUDY HEATMAP</div>
                  <div style={{fontSize:13,color:"#4b5563",marginBottom:20}}>Apr 11 – Jul 30, 2026 · Click any cell to see sessions for that day</div>
                  <div style={{background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.07)",borderRadius:16,padding:"20px 24px"}}>
                    <HeatmapCalendar sessions={sessions}/>
                  </div>
                </div>
              )}

              {/* ========== MISSIONS TAB ========== */}
              {activeTab==="missions"&&(
                <div>
                  {/* Secondary nav for missions */}
                  <div style={{marginBottom:20}}>
                    <div style={{display:"flex",gap:6,background:"rgba(255,255,255,.03)",borderRadius:12,padding:4,border:"1px solid rgba(255,255,255,.06)",marginBottom:20}}>
                      {[
                        {id:"today",     label:"⚡ Today"},
                        {id:"upcoming",  label:"📅 Upcoming"},
                        {id:"all",       label:"🗓 All 110"},
                        {id:"completed", label:"🏆 Completed"},
                      ].map(t=>(
                        <button key={t.id} className="tab" onClick={()=>setView(t.id)} style={{
                          flex:1,padding:"9px 8px",borderRadius:9,fontSize:13,fontWeight:700,fontFamily:"inherit",
                          background:view===t.id?"rgba(245,158,11,.15)":"transparent",
                          color:view===t.id?"#f59e0b":"#4b5563",
                          border:view===t.id?"1px solid rgba(245,158,11,.35)":"1px solid transparent",
                          letterSpacing:.2,
                        }}>{t.label}</button>
                      ))}
                    </div>

                    {/* TODAY: Mission Control */}
                    {view==="today"&&todayDay&&(
                      <div>
                        <div style={{
                          background:"linear-gradient(135deg,#0b1525 0%,#0d1a30 100%)",
                          border:"1px solid rgba(245,158,11,.2)",borderRadius:20,padding:"28px 28px 24px",
                          marginBottom:20,boxShadow:"0 0 60px rgba(245,158,11,.05)",animation:"glow 3s ease infinite",
                        }}>
                          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:22}}>
                            <div style={{height:3,width:24,background:"#f59e0b",borderRadius:999}}/>
                            <span style={{fontFamily:"'Orbitron',monospace",fontSize:12,color:"#f59e0b",letterSpacing:2.5,fontWeight:800}}>MISSION CONTROL — TODAY</span>
                            <div style={{height:3,flex:1,background:"rgba(245,158,11,.1)",borderRadius:999}}/>
                          </div>
                          <TodayMissionControl day={todayDay} habits={habits} stats={stats} sessions={sessions}/>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Card Grid */}
                  {filtered.length===0?(
                    <div style={{textAlign:"center",padding:"80px 20px",color:"#2d3748"}}>
                      <div style={{fontSize:48,marginBottom:16}}>{view==="completed"?"🏆":view==="today"?"😴":"📭"}</div>
                      <div style={{fontSize:20,fontFamily:"'Orbitron',monospace",letterSpacing:1,color:"#374151"}}>
                        {view==="completed"?"No wins yet — go conquer today!":"Nothing here yet"}
                      </div>
                    </div>
                  ):(
                    <div style={{display:"grid",gridTemplateColumns:view==="today"?"1fr":"repeat(auto-fill,minmax(320px,1fr))",gap:16}}>
                      {filtered.map(day=>(
                        <DayCard key={day.id} day={day}
                          isToday={day.date===today} isPast={day.date<today}
                          habits={habits}
                          onToggleCompleted={()=>toggleCompleted(day.id)}
                          onAddTarget={(t,p)=>addTarget(day.id,t,p)}
                          onToggleTarget={tid=>toggleTarget(day.id,tid)}
                          onRemoveTarget={tid=>removeTarget(day.id,tid)}
                          onUpdateTomorrow={t=>updateDay(day.id,{tomorrowTargets:t})}
                          onToggleHabit={hid=>toggleHabit(day.id,hid)}
                          onAddTimeBlock={b=>addTimeBlock(day.id,b)}
                          onToggleTimeBlock={bid=>toggleBlock(day.id,bid)}
                          onRemoveTimeBlock={bid=>removeBlock(day.id,bid)}
                          onXPEarned={(xp,em)=>fireXP(xp,em)}
                        />
                      ))}
                    </div>
                  )}
                </div>
              )}

            </div>{/* end main content */}

            {/* ── POMODORO (always visible) ── */}
            <PomodoroWidget onXPEarned={handlePomXP} onConfetti={fireConfetti}/>

            {/* ── MODALS ── */}
            {showHabitSetup&&<HabitSetupModal habits={habits} onSave={saveHabits} onClose={()=>setHabitSetup(false)}/>}
            {showGoalEditor&&<GoalEditor goals={goals} onSave={g=>{setGoals(g);sStore(GOALS_KEY,g);setGoalEditor(false);}} onClose={()=>setGoalEditor(false)}/>}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
  </body>
</html>
